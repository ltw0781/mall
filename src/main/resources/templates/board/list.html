<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
</head>

<body>
    <h1>게시판 목록</h1>
    <a href="#none">글쓰기</a>

    <div class="boarList">
        <table border="1">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>카테고리</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>작성일</th>
                    <th>조회수</th>
                </tr>
            </thead>
            <th:block th:each="board : ${boardList}">
                <tr>
                    <td th:text="${board.no}"></td>
                    <td th:text="${board.category}"></td>
                    <td>
                        <a th:href="|/board/read?no=${board.no}|" th:text="${board.title}"></a>
                    </td>
                    <td th:text="${board.writer}"></td>
                    <td th:text="${#dates.format(board.createdAt, 'yyyy-MM-dd')}"></td>
                    <td th:text="${board.viewCount}"></td>
                </tr>
            </th:block>
        </table>
    </div>

</body>

</html>
