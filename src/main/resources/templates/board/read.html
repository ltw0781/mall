<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 상세</title>
</head>

<body>
    <h1>게시판 상세</h1>

    <div th:if="${board == null}">
        <p>존재하지 않는 게시글입니다.</p>
        <a href="/board/list">목록으로</a>
    </div>

    <div th:if="${board != null}">
        <p><strong>번호:</strong> <span th:text="${board.no}"></span></p>
        <p><strong>카테고리:</strong> <span th:text="${board.category}"></span></p>
        <p><strong>제목:</strong> <span th:text="${board.title}"></span></p>
        <p><strong>작성자:</strong> <span th:text="${board.writer}"></span></p>
        <p><strong>작성일:</strong> <span th:text="${#dates.format(board.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
        <p><strong>수정일:</strong> <span th:text="${#dates.format(board.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></p>
        <p><strong>조회수:</strong> <span th:text="${board.viewCount}"></span></p>
        <p><strong>내용:</strong></p>
        <pre th:text="${board.content}"></pre>

        <a href="/board/list">목록</a>
        <a th:href="|/board/update?no=${board.no}|">수정</a>
        <form action="/board/delete" method="post" style="display:inline;">
            <input type="hidden" name="no" th:value="${board.no}">
            <button type="submit">삭제</button>
        </form>
    </div>

</body>

</html>
